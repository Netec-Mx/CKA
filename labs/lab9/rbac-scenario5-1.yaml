apiVersion: v1
kind: Service
metadata:
  name: discovery-api
  namespace: lab5
  labels:
    app: discovery-api
spec:
  type: ClusterIP
  selector:
    app: discovery-api
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-configmap-reader
  namespace: lab5
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]