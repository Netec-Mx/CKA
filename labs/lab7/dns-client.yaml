apiVersion: v1
kind: Pod
metadata:
  name: environment-client
  namespace: development
  labels:
    app: environment-client
spec:
  containers:
    - name: client
      image: busybox:1.36
      command:
        - sh
        - -c
        - sleep 3600
      env:
        - name: TARGET_SERVICE
          value: webapp-svc