apiVersion: v1
kind: Pod
metadata:
  name: dns-client
  namespace: lab6
  labels:
    app: dns-client
spec:
  dnsPolicy: None
  dnsConfig:
    nameservers:
      - 1.2.3.4
  containers:
    - name: client
      image: busybox:1.36
      command:
        - sh
        - -c
        - sleep 3600
  restartPolicy: Never
