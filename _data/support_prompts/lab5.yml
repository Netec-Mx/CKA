# Prompts de apoyo para la Práctica 3
# El slug del laboratorio debe ser: lab5

tarea1:
  title: "Explicar la Tarea 1 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 1 de la
    Práctica 3 de Kubernetes.

    En esta tarea preparé dos Deployments de prueba dentro del namespace lab5,
    desplegué las aplicaciones app-web y app-backend y validé la distribución
    inicial de sus Pods entre los nodos del clúster Minikube de tres nodos.

    Explica el propósito de cada comando, manifiesto, configuración o procedimiento,
    cómo funciona la programación inicial de Pods, cómo interpretar las salidas
    esperadas, cómo validar que la tarea se completó correctamente y qué errores
    comunes podrían presentarse.

tarea2:
  title: "Explicar la Tarea 2 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 2 de la
    Práctica 3 de Kubernetes.

    En esta tarea ejecuté kubectl cordon sobre el nodo minikube-m02 para marcarlo
    como no programable. Después escalé temporalmente app-web para comprobar que
    los nuevos Pods evitaban el nodo cordoned mientras los Pods existentes
    continuaban ejecutándose normalmente.

    Explica cómo funciona cordon, qué significa SchedulingDisabled, qué efecto
    tiene sobre el scheduler y los Pods existentes, cómo interpretar las salidas
    esperadas, cómo validar que la tarea se completó correctamente y qué errores
    comunes podrían presentarse.

tarea3:
  title: "Explicar la Tarea 3 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 3 de la
    Práctica 3 de Kubernetes.

    En esta tarea creé PodDisruptionBudgets para app-web y app-backend. Configuré
    un PDB que permite una disrupción y otro más restrictivo con minAvailable igual
    al número total de réplicas, provocando ALLOWED DISRUPTIONS igual a cero.

    Explica qué es un PodDisruptionBudget, cómo funciona minAvailable, cómo se
    calcula ALLOWED DISRUPTIONS, cómo protege aplicaciones durante disrupciones
    voluntarias, cómo validar los PDBs y qué errores comunes podrían presentarse.

tarea4:
  title: "Explicar la Tarea 4 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 4 de la
    Práctica 3 de Kubernetes.

    En esta tarea ejecuté kubectl drain sobre minikube-m02, observé que el proceso
    fue bloqueado por un PodDisruptionBudget restrictivo, diagnostiqué la causa
    mediante kubectl y escalé app-backend para permitir una disrupción. Después
    repetí el drain y confirmé la reprogramación de los Pods en otros nodos.

    Explica cómo funciona drain, el propósito de --ignore-daemonsets y
    --delete-emptydir-data, cómo los PDBs afectan las evicciones, cómo diagnosticar
    un drain bloqueado, cómo interpretar las salidas esperadas y qué errores
    comunes podrían presentarse.

tarea5:
  title: "Explicar la Tarea 5 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 5 de la
    Práctica 3 de Kubernetes.

    En esta tarea ejecuté kubectl uncordon para reincorporar minikube-m02 al
    clúster, comprobé que Kubernetes no redistribuye automáticamente los Pods
    existentes y utilicé rolling restart para provocar nuevas decisiones del
    scheduler. Finalmente validé nodos, Deployments, Pods y PodDisruptionBudgets.

    Explica cómo funciona uncordon, por qué el scheduler no rebalancea
    automáticamente los Pods existentes, cómo un rolling restart permite nuevas
    asignaciones, cómo interpretar la validación final y qué errores comunes
    podrían presentarse.